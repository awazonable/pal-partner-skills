<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palworld パートナースキル DB (v1.0)</title>
  <meta name="description" content="Palworld v1.0 のパートナースキル一覧と特徴フィルタ" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <h1>Palworld パートナースキル DB <span class="badge-version">v1.0</span></h1>
      <div class="header-controls">
        <label class="level-control">
          パートナースキル Lv
          <span class="level-buttons" id="levelButtons" role="radiogroup" aria-label="パートナースキルレベル"></span>
        </label>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="テーマ切替">🌓</button>
      </div>
    </div>
    <p class="disclaimer">
      対象は <strong>v1.0</strong>（β版から効果が変更）。これは <strong>PoC の代表サンプル</strong>で、
      <span class="chip-unverified-inline">要検証</span> 印はパル対応・数値が未確定です。全 <span id="totalInGame">82</span> 種の網羅と数値確定は今後拡充します。
    </p>
  </header>

  <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="sidebar">
    フィルタ ▾
  </button>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="フィルタ">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="スキル名・Pal 名・説明で検索" aria-label="検索" />
      </div>
      <div id="filterGroups"><!-- tags.json から生成 --></div>
      <div class="filter-group">
        <h3 class="filter-group-title">その他</h3>
        <div class="filter-options">
          <label class="filter-option"><input type="checkbox" id="flagStackable" /> <span>重複可のみ</span></label>
          <label class="filter-option"><input type="checkbox" id="flagUnique" /> <span>ユニークのみ</span></label>
          <label class="filter-option"><input type="checkbox" id="flagAlpha" /> <span>α差分ありのみ</span></label>
          <label class="filter-option"><input type="checkbox" id="flagVerified" /> <span>検証済みのみ</span></label>
        </div>
      </div>
      <button id="clearFilters" class="clear-filters" type="button">フィルタをクリア</button>
    </aside>

    <main class="content">
      <div class="content-bar">
        <span class="result-count"><strong id="resultCount">0</strong> / <span id="totalCount">0</span> 件</span>
        <label class="sort-control">
          並び替え
          <select id="sortSelect">
            <option value="condition">発動場面 → Pal 名</option>
            <option value="pal">Pal 名</option>
            <option value="element">属性</option>
            <option value="name">スキル名</option>
          </select>
        </label>
      </div>
      <div id="activeFilters" class="active-filters" aria-live="polite"></div>
      <div id="cards" class="cards"></div>
      <p id="emptyState" class="empty-state" hidden>条件に一致するスキルがありません。</p>
    </main>
  </div>

  <footer class="site-footer">
    <p>データ出典は各種コミュニティ DB を突き合わせて整理（<code>design/01-research.md</code> 参照）。
       Palworld は Pocketpair, Inc. の作品です。本サイトは非公式のファンメイド資料です。</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
